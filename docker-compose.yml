version: "3.9"
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./db/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  insights-api:
    build: ./insights-api
    ports:
      - "8080:8080"
    environment:
      CLICKHOUSE_URL: jdbc:ch://clickhouse:8123/adtech
    depends_on:
      - clickhouse
